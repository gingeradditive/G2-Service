# --------------------------- Service macros ---------------------------------
[gcode_macro EXTRUDER_SET_ZONE_1]
gcode:
  #M118 execute EXTRUDER_SET_ZONE_1
  {% set S = params.S|default(0.0)|float %}
  SET_HEATER_TEMPERATURE HEATER=extruder TARGET={S}

[gcode_macro EXTRUDER_SET_ZONE_2]
gcode:
  #M118 execute EXTRUDER_SET_ZONE_2
  {% set S = params.S|default(0.0)|float %}
  SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET={S}

[gcode_macro EXTRUDER_SET_ZONE_3]
gcode:
  #M118 execute EXTRUDER_SET_ZONE_3
  {% set S = params.S|default(0.0)|float %}
  SET_HEATER_TEMPERATURE HEATER=extruder2 TARGET={S}

[gcode_macro EXTRUDER_SET_ZONE_4]
gcode:
  #M118 execute EXTRUDER_SET_ZONE_4
  {% set S = params.S|default(0.0)|float %}
  SET_HEATER_TEMPERATURE HEATER=extruder3 TARGET={S}

[gcode_macro EXTRUDER_WAIT_ZONE_1]
gcode:
  #M118 execute EXTRUDER_WAIT_ZONE_1
  {% set S = params.S|default(0.0)|float %}
  TEMPERATURE_WAIT SENSOR=extruder MINIMUM={S-10} MAXIMUM={S+100}

[gcode_macro EXTRUDER_WAIT_ZONE_2]
gcode:
  #M118 execute EXTRUDER_WAIT_ZONE_2
  {% set S = params.S|default(0.0)|float %}
  TEMPERATURE_WAIT SENSOR=extruder1 MINIMUM={S-10} MAXIMUM={S+100}

[gcode_macro EXTRUDER_WAIT_ZONE_3]
gcode:
  #M118 execute EXTRUDER_WAIT_ZONE_3
  {% set S = params.S|default(0.0)|float %}
  TEMPERATURE_WAIT SENSOR=extruder2 MINIMUM={S-10} MAXIMUM={S+100}

[gcode_macro EXTRUDER_WAIT_ZONE_4]
gcode:
  #M118 execute EXTRUDER_WAIT_ZONE_4
  {% set S = params.S|default(0.0)|float %}
  TEMPERATURE_WAIT SENSOR=extruder3 MINIMUM={S-10} MAXIMUM={S+100}
    
[gcode_macro EXTRUDER_SHUTDOWN]
gcode:
  #M118 execute EXTRUDER_SHUTDOWN
  SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0.0
  SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET=0.0
  SET_HEATER_TEMPERATURE HEATER=extruder2 TARGET=0.0
  SET_HEATER_TEMPERATURE HEATER=extruder3 TARGET=0.0

[gcode_macro EXTRUDER_MIXING_MULTIPLIER]
gcode:
  {% set S = params.S|default(1)|float %}
  SET_EXTRUDER_ROTATION_DISTANCE EXTRUDER=mixing_stepper DISTANCE={7600 / S} 
  #7600 è il mio rotation distance fisso dell'E1
  SYNC_EXTRUDER_MOTION EXTRUDER=mixing_stepper MOTION_QUEUE=extruder

# ------------------------ Override comando M104 -----------------------------
[gcode_macro M104]
rename_existing: M104.1
gcode:
  {% set S = params.S %}
  {% set Z = params.Z %}
  {% set T = params.T %}
    
  {% if Z == '4' %}
  M104.1 S{S} T3
  {% elif Z == '3' %}
  M104.1 S{S} T2
  {% elif Z == '2' %}
  M104.1 S{S} T1
  {% elif Z == '1' %}
  M104.1 S{S} T0
  {% else %}
  M104.1 S{S} T{T}
  {% endif %}