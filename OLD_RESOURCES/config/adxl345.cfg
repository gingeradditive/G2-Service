# ============================================================================
# ADXL345 v2.0 BTT — configurazione test S-Curve
# ============================================================================
# Includere in printer.cfg SOLO durante i test:
#   [include tests/configs/adxl345.cfg]
# Commentare/rimuovere al termine dei test.
# ============================================================================

# ----------------------------------------------------------------------------
# 5 accelerometri (mappatura verificata 2026-07-20, schede una alla volta).
# Tutte BTT ADXL345 v2.0: RP2040 + ADXL cablati insieme, quindi cs_pin e
# spi_bus sono identici per costruzione — cambia solo mcu/serial.
# Tutte riflashate 2026-07-20 con firmware dall'albero Kalico del RPi
# (v2026.06.00-5-g30c65e09) via scripts/flash_usb.py -t rp2 (picoboot USB,
# nessun pulsante BOOTSEL). Attenzione: il seriale USB è l'ID del chip, quindi
# se una scheda viene sostituita va riletto con `ls /dev/serial/by-id/`.
#
#   ugello    -> 454741505A87B68A   (chip senza nome = default, vedi sotto)
#   x_gantry  -> 504450610852561C   mezzeria trave X
#   z_alto    -> 5044506110C6561C   asta Z X1000/Y1000, parte alta
#   z_basso   -> 5044506118A5D01C   asta Z X1000/Y1000, parte bassa
#   quad_sup  -> 454741505207F8EA   quadrilatero superiore
# ----------------------------------------------------------------------------

# Ugello: resta il chip SENZA NOME, cioè il default di Kalico. Fondamentale per
# compatibilità: sweep.py, scan.py e le macro storiche chiamano
# ACCELEROMETER_MEASURE senza CHIP e devono continuare a leggere l'ugello.
[mcu adxl]
serial: /dev/serial/by-id/usb-Klipper_rp2040_454741505A87B68A-if00

[adxl345]
cs_pin: adxl:gpio9
spi_bus: spi1a
# Se il sensore è montato ruotato rispetto agli assi macchina, decommentare:
# axes_map: x, y, z

[resonance_tester]
accel_chip: adxl345
probe_points: 500, 500, 50  # centro G2, Z sicuro

# ----------------------------------------------------------------------------
# axes_map — determinati il 2026-07-20.
#
# Sintassi Klipper: "axes_map: A, B, C" dove A e' l'asse DEL SENSORE che
# corrisponde alla X macchina, B alla Y macchina, C alla Z macchina.
#
# Metodo (il test di movimento NON funziona sui sensori fissi al telaio: non
# traslano, sentono solo la vibrazione strutturale che non e' allineata con la
# direzione del moto):
#   - asse verticale: dalla gravita' a riposo. Riferimento = ugello, che il
#     test di movimento conferma allineato e che legge -9346 sul verticale
#     -> in questo sistema un asse rivolto verso l'ALTO legge NEGATIVO.
#   - asse orizzontale noto: ispezione fisica della serigrafia (Davide).
#   - terzo asse: dedotto imponendo terna destrorsa (X x Y = Z), unica
#     possibilita' fisica una volta fissati gli altri due.
# ----------------------------------------------------------------------------

[mcu adxl_x_gantry]
serial: /dev/serial/by-id/usb-Klipper_rp2040_504450610852561C-if00

[adxl345 x_gantry]
cs_pin: adxl_x_gantry:gpio9
spi_bus: spi1a
# Gravita': Z verticale (-10572), come l'ugello -> montaggio standard.
# Il movimento Y da' risposta sull'asse Y del sensore (la trave trasla in Y):
# coerente con orientamento di default. NOTA: i SEGNI degli assi orizzontali
# non sono stati verificati per ispezione — se servisse il verso, ricontrollare.
# axes_map: x, y, z  (default)

[mcu adxl_z_alto]
serial: /dev/serial/by-id/usb-Klipper_rp2040_5044506110C6561C-if00

[adxl345 z_alto]
cs_pin: adxl_z_alto:gpio9
spi_bus: spi1a
# +X sensore -> +X macchina (ispezione); +Y sensore verso l'alto (-10066)
# -> Z macchina = +y sensore; Y macchina = -z sensore (terna destrorsa)
axes_map: x, -z, y

[mcu adxl_z_basso]
serial: /dev/serial/by-id/usb-Klipper_rp2040_5044506118A5D01C-if00

[adxl345 z_basso]
cs_pin: adxl_z_basso:gpio9
spi_bus: spi1a
# +X sensore -> -X macchina (ispezione); +Y sensore verso il basso (+9992)
# -> Z macchina = -y sensore; Y macchina = -z sensore (terna destrorsa)
axes_map: -x, -z, -y

[mcu adxl_quad_sup]
serial: /dev/serial/by-id/usb-Klipper_rp2040_454741505207F8EA-if00

[adxl345 quad_sup]
cs_pin: adxl_quad_sup:gpio9
spi_bus: spi1a
# +X sensore -> +Y macchina (ispezione); +Y sensore verso il basso (+9104)
# -> Z macchina = -y sensore; X macchina = -z sensore (terna destrorsa)
axes_map: -z, x, -y

# Quadrilatero INFERIORE, stessa verticale di quad_sup (mezzeria lato destro).
# Serve a discriminare rocking di corpo rigido sui piedi (quad_inf ~ quad_sup)
# da deformazione del telaio (quad_inf << quad_sup): e' la misura che l'analisi
# dello STEP indica come dirimente, perche' il telaio rende circa un quarto
# della rigidezza teorica dei suoi profilati e non sappiamo se il difetto sia
# alla base o nei nodi.
#
# Storia del 2026-07-20: al primo montaggio la scheda si enumerava ma non
# rispondeva all'handshake Klipper ("Timeout on connect"), e con l'MCU
# dichiarato e irraggiungibile Kalico NON PARTE (shutdown, macchina ferma).
# Causa: cavo USB difettoso; sostituito il cavo, handshake OK.
# Se ricapita: verificare sempre con console.py PRIMA di deployare
#   ~/kalico-env/bin/python3 scripts/console.py <dev>  -> "Loaded ... commands"
[mcu adxl_quad_inf]
serial: /dev/serial/by-id/usb-Klipper_rp2040_5044506108A4801C-if00

[adxl345 quad_inf]
cs_pin: adxl_quad_inf:gpio9
spi_bus: spi1a
# +Y sensore -> +Y macchina (ispezione); +X sensore verso l'alto (-10363)
# -> Z macchina = +x sensore; X macchina = -z sensore (terna destrorsa)
axes_map: -z, y, x

# Sponda Y destra, mezzeria (~Y500). Aggiunto il 2026-07-25.
# Le due sponde Y hanno un motore ciascuna e una cinghia ciascuna (Y1/Y2), e
# sappiamo dalle curve di soglia che quale cinghia perde passi dipende dalla
# posizione X del carrello: questo sensore misura direttamente il lato destro,
# dove finora avevamo solo misure indirette. La mezzeria e' anche il punto di
# massima ampiezza se la sponda flette come trave appoggiata.
[mcu adxl_y_dx]
serial: /dev/serial/by-id/usb-Klipper_rp2040_45474150540BD76A-if00

[adxl345 y_dx]
cs_pin: adxl_y_dx:gpio9
spi_bus: spi1a
# +Y sensore -> +Y macchina (ispezione); +X sensore verso l'alto (-9549)
# -> Z macchina = +x sensore; X macchina = -z sensore (terna destrorsa).
# Stessa terna di quad_inf: le due schede sono montate nello stesso modo.
axes_map: -z, y, x

# Piastra angolare del PIEDINO, angolo X0/Y1000. Aggiunto il 2026-07-25.
# E' il punto di contatto con il pavimento: chiude la catena di misura
# ugello -> trave -> telaio -> TERRA. Con quad_inf sulla stessa banda dice
# quanta energia il piedino trasmette al pavimento invece di dissiparla, che
# e' il dato che manca al progetto isolamento piedini. L'angolo X0/Y1000 non e'
# casuale: e' il caso peggiore delle soglie skip ed e' dove scende l'ombelicale.
[mcu adxl_piede]
serial: /dev/serial/by-id/usb-Klipper_rp2040_454741505C08996A-if00

[adxl345 piede]
cs_pin: adxl_piede:gpio9
spi_bus: spi1a
# +Y sensore -> +Y macchina (ispezione); Z sensore verso il BASSO (+9576: la
# scheda e' montata capovolta, coerente con una piastra angolare orizzontale)
# -> Z macchina = -z sensore; X macchina = -x sensore (terna destrorsa)
axes_map: -x, y, -z

# ============================================================================
# Macro test per acquisizione S-Curve
#
# Nota sintassi ACCELEROMETER_MEASURE in Kalico:
#   - Prima chiamata (senza NAME): avvia acquisizione
#   - Seconda chiamata (con NAME=xxx): ferma e salva in /tmp/adxl345-xxx.csv
# ============================================================================

# ============================================================================
# Impact test — frequenze naturali telaio G2
#
# Principio: impulso a velocità/accel di stampa reale → stop → decadimento.
# N ripetizioni per asse per testare ripetibilità. G28 solo in TEST_IMPULSE_ALL.
#
# Parametri comuni:
#   REPEAT  = numero ripetizioni per asse (default 3)
#   DECAY   = ms di decadimento dopo lo stop (default 4000)
#   SETTLE  = ms di pausa tra ripetizioni per smorzamento (default 4000)
#   NAME    = prefisso file; output: /tmp/adxl345-<NAME>_r1.csv, _r2, _r3
#
# Parametri XY (valori stampa G2):
#   SPEED   = mm/s (default 500)
#   ACCEL   = mm/s² (default 3000 — ABBASSATO dal 10000 originale il 2026-07-20:
#             l'inviluppo skip misurato il 19/07 sull'intera griglia da un worst
#             case di 3600 (X) e 3400 (Y), quindi 10000 avrebbe fatto perdere
#             passi di sicuro. SET_VELOCITY_LIMIT non e' limitato da max_accel,
#             quindi il valore della macro veniva applicato davvero.)
#   DIST    = mm (default 50 — abbastanza per rampa completa a 500 mm/s)
#
# Parametri Z (z-hop reale G2):
#   SPEED   = mm/s (default 10)
#   ACCEL   = mm/s² (default 500)
#   DIST    = mm (default 2 — z-hop tipico)
# ============================================================================

[gcode_macro TEST_IMPULSE_X]
description: Impact test asse X — velocità/accel di stampa reale, N ripetizioni
gcode:
    {% set SPEED  = params.SPEED|default(500)|float %}
    {% set ACCEL  = params.ACCEL|default(3000)|float %}
    {% set DIST   = params.DIST|default(50)|float %}
    {% set DECAY  = params.DECAY|default(4000)|int %}
    {% set SETTLE = params.SETTLE|default(4000)|int %}
    {% set REPEAT = params.REPEAT|default(3)|int %}
    {% set NAME   = params.NAME|default("impulse_x") %}
    G90
    G1 X500 Y500 F{(SPEED * 60)|int}
    M400
    SET_VELOCITY_LIMIT VELOCITY={SPEED} ACCEL={ACCEL}
    {% for i in range(REPEAT) %}
        G4 P{SETTLE}
        ACCELEROMETER_MEASURE
        G1 X{500 + DIST} F{(SPEED * 60)|int}
        M400
        G4 P{DECAY}
        ACCELEROMETER_MEASURE NAME={NAME}_r{i + 1}
        G1 X500 F{(SPEED * 60)|int}
        M400
    {% endfor %}
    SET_VELOCITY_LIMIT VELOCITY=500 ACCEL=3000

[gcode_macro TEST_IMPULSE_Y]
description: Impact test asse Y — velocità/accel di stampa reale, N ripetizioni
gcode:
    {% set SPEED  = params.SPEED|default(500)|float %}
    {% set ACCEL  = params.ACCEL|default(3000)|float %}
    {% set DIST   = params.DIST|default(50)|float %}
    {% set DECAY  = params.DECAY|default(4000)|int %}
    {% set SETTLE = params.SETTLE|default(4000)|int %}
    {% set REPEAT = params.REPEAT|default(3)|int %}
    {% set NAME   = params.NAME|default("impulse_y") %}
    G90
    G1 X500 Y500 F{(SPEED * 60)|int}
    M400
    SET_VELOCITY_LIMIT VELOCITY={SPEED} ACCEL={ACCEL}
    {% for i in range(REPEAT) %}
        G4 P{SETTLE}
        ACCELEROMETER_MEASURE
        G1 Y{500 + DIST} F{(SPEED * 60)|int}
        M400
        G4 P{DECAY}
        ACCELEROMETER_MEASURE NAME={NAME}_r{i + 1}
        G1 Y500 F{(SPEED * 60)|int}
        M400
    {% endfor %}
    SET_VELOCITY_LIMIT VELOCITY=500 ACCEL=3000

[gcode_macro TEST_IMPULSE_Z]
description: Impact test asse Z — simula z-hop reale G2 (2mm a 10mm/s), N ripetizioni
gcode:
    {% set SPEED  = params.SPEED|default(10)|float %}
    {% set ACCEL  = params.ACCEL|default(500)|float %}
    {% set DIST   = params.DIST|default(2)|float %}
    {% set DECAY  = params.DECAY|default(6000)|int %}
    {% set SETTLE = params.SETTLE|default(5000)|int %}
    {% set REPEAT = params.REPEAT|default(3)|int %}
    {% set NAME   = params.NAME|default("impulse_z") %}
    G90
    G1 Z100 F{(SPEED * 60)|int}
    M400
    SET_VELOCITY_LIMIT VELOCITY={SPEED} ACCEL={ACCEL}
    {% for i in range(REPEAT) %}
        G4 P{SETTLE}
        ACCELEROMETER_MEASURE
        G1 Z{100 + DIST} F{(SPEED * 60)|int}
        M400
        G4 P{DECAY}
        ACCELEROMETER_MEASURE NAME={NAME}_r{i + 1}
        G1 Z100 F{(SPEED * 60)|int}
        M400
    {% endfor %}
    SET_VELOCITY_LIMIT VELOCITY=500 ACCEL=3000

[gcode_macro TEST_IMPULSE_ALL]
description: Impact test XYZ — G28 una volta, poi X/Y/Z con ripetizioni
gcode:
    {% set REPEAT = params.REPEAT|default(3)|int %}
    G28
    G90
    G1 Z50 F600
    G1 X500 Y500 F{500 * 60}
    M400
    TEST_IMPULSE_X REPEAT={REPEAT}
    TEST_IMPULSE_Y REPEAT={REPEAT}
    TEST_IMPULSE_Z REPEAT={REPEAT}

[gcode_macro TEST_ORIENT_ADXL]
description: Verifica orientamento assi ADXL345 (sensore ugello) con piccoli movimenti X e Y
gcode:
    G28
    G90
    G1 Z50 F600
    G1 X500 Y500 F6000
    M400
    ACCELEROMETER_MEASURE
    G1 X600 F3000
    M400
    ACCELEROMETER_MEASURE NAME=orient_x
    G1 X500 F3000
    M400
    ACCELEROMETER_MEASURE
    G1 Y600 F3000
    M400
    ACCELEROMETER_MEASURE NAME=orient_y
    G1 Y500 F3000
    M400

[gcode_macro _TEST_ORIENT_ADXL_CHIP]
description: Helper interno — verifica orientamento di un CHIP specifico (usare i wrapper per-sensore sotto)
gcode:
    {% set CHIP = params.CHIP %}
    G28
    G90
    G1 Z50 F600
    G1 X500 Y500 F6000
    M400
    ACCELEROMETER_MEASURE CHIP={CHIP}
    G1 X600 F3000
    M400
    ACCELEROMETER_MEASURE CHIP={CHIP} NAME=orient_{CHIP}_x
    G1 X500 F3000
    M400
    ACCELEROMETER_MEASURE CHIP={CHIP}
    G1 Y600 F3000
    M400
    ACCELEROMETER_MEASURE CHIP={CHIP} NAME=orient_{CHIP}_y
    G1 Y500 F3000
    M400

[gcode_macro TEST_ORIENT_X_GANTRY]
description: Verifica orientamento assi ADXL "x_gantry" (mezzeria trave X)
gcode:
    _TEST_ORIENT_ADXL_CHIP CHIP=x_gantry

[gcode_macro TEST_ORIENT_Z_ALTO]
description: Verifica orientamento assi ADXL "z_alto" (asta Z X1000/Y1000, alto)
gcode:
    _TEST_ORIENT_ADXL_CHIP CHIP=z_alto

[gcode_macro TEST_ORIENT_Z_BASSO]
description: Verifica orientamento assi ADXL "z_basso" (asta Z X1000/Y1000, basso)
gcode:
    _TEST_ORIENT_ADXL_CHIP CHIP=z_basso

[gcode_macro TEST_ORIENT_QUAD_SUP]
description: Verifica orientamento assi ADXL "quad_sup" (quadrilatero superiore)
gcode:
    _TEST_ORIENT_ADXL_CHIP CHIP=quad_sup

[gcode_macro TEST_ORIENT_QUAD_INF]
description: Verifica orientamento assi ADXL "quad_inf" (quadrilatero inferiore)
gcode:
    _TEST_ORIENT_ADXL_CHIP CHIP=quad_inf

[gcode_macro TEST_ORIENT_Y_DX]
description: Verifica orientamento assi ADXL "y_dx" (sponda Y destra, mezzeria)
gcode:
    _TEST_ORIENT_ADXL_CHIP CHIP=y_dx

[gcode_macro TEST_ORIENT_PIEDE]
description: Verifica orientamento assi ADXL "piede" (piastra piedino X0/Y1000)
gcode:
    _TEST_ORIENT_ADXL_CHIP CHIP=piede

[gcode_macro TEST_SCURVE_X]
description: Singola passata X controllata per acquisizione accelerometro
gcode:
    {% set SPEED = params.SPEED|default(500)|float %}
    {% set ACCEL = params.ACCEL|default(3000)|float %}
    {% set NAME  = params.NAME|default("scurve_x") %}
    G28
    G90
    G1 Y500 F6000
    G1 Z50 F600
    SET_VELOCITY_LIMIT VELOCITY={SPEED} ACCEL={ACCEL}
    G1 X50 F{(SPEED * 60)|int}
    M400
    ACCELEROMETER_MEASURE
    G1 X950 F{(SPEED * 60)|int}
    M400
    ACCELEROMETER_MEASURE NAME={NAME}

[gcode_macro TEST_SCURVE_Y]
description: Singola passata Y controllata per acquisizione accelerometro
gcode:
    {% set SPEED = params.SPEED|default(500)|float %}
    {% set ACCEL = params.ACCEL|default(3000)|float %}
    {% set NAME  = params.NAME|default("scurve_y") %}
    G28
    G90
    G1 X500 F6000
    G1 Z50 F600
    SET_VELOCITY_LIMIT VELOCITY={SPEED} ACCEL={ACCEL}
    G1 Y50 F{(SPEED * 60)|int}
    M400
    ACCELEROMETER_MEASURE
    G1 Y950 F{(SPEED * 60)|int}
    M400
    ACCELEROMETER_MEASURE NAME={NAME}
