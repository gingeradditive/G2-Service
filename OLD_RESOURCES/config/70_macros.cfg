# ============================================================================
# 70 - Macros: lifecycle stampa, materiale, nozzle e utility estrusore
# ============================================================================

# ------------------------ Lifecycle stampa base -----------------------------
[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
gcode:
  TURN_OFF_HEATERS
  M106 S0
  # clear pause_next_layer and pause_at_layer as preparation for next print
  CANCEL_PRINT_BASE


[gcode_macro PAUSE]
description: Pause the actual running print
rename_existing: PAUSE_BASE
gcode:
  M118 chiamata pausa

  SAVE_GCODE_STATE NAME=PAUSE_STATE

  {% set temp1 = printer.extruder.target %}
  {% set temp2 = printer.extruder1.target %}
  {% set temp3 = printer.extruder2.target %}
  {% set temp4 = printer.extruder3.target %}

  SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=last_extruder_temp VALUE="{{'temp1': temp1,'temp2': temp2,'temp3': temp3,'temp4': temp4}}"

  G91
  G1 Z10 F6000
  G90
  G1 X0 Y0 F6000

  EXTRUDER_SHUTDOWN

  PAUSE_BASE


[gcode_macro RESUME]
description: Resume the actual running print
rename_existing: RESUME_BASE
variable_last_extruder_temp: {'temp1': 0,'temp2': 0,'temp3': 0,'temp4': 0}
gcode:
  {% set sp_move = printer.configfile.settings.pause_resume.recover_velocity %}

  EXTRUDER_SET_ZONE_1 S={last_extruder_temp.temp1}
  EXTRUDER_SET_ZONE_2 S={last_extruder_temp.temp2}
  EXTRUDER_SET_ZONE_3 S={last_extruder_temp.temp3}
  EXTRUDER_SET_ZONE_4 S={last_extruder_temp.temp4}

  TEMPERATURE_WAIT SENSOR=extruder  MINIMUM={last_extruder_temp.temp1-10} MAXIMUM={last_extruder_temp.temp1+10}
  TEMPERATURE_WAIT SENSOR=extruder1 MINIMUM={last_extruder_temp.temp2-10} MAXIMUM={last_extruder_temp.temp2+10}
  TEMPERATURE_WAIT SENSOR=extruder2 MINIMUM={last_extruder_temp.temp3-10} MAXIMUM={last_extruder_temp.temp3+10}
  TEMPERATURE_WAIT SENSOR=extruder3 MINIMUM={last_extruder_temp.temp4-10} MAXIMUM={last_extruder_temp.temp4+10}

  RESTORE_GCODE_STATE NAME=PAUSE_STATE MOVE=1 MOVE_SPEED={sp_move}

  RESUME_BASE VELOCITY={params.VELOCITY|default(sp_move)}

# ------------------------------ Purge line ---------------------------------

[gcode_macro PURGE_PARKING]
gcode:
  #M118 execute PURGE_PARKING
  G90
  G1 X0 Y0 Z{ params.PURGE_LAYER_HEIGHT} F{ params.PURGE_PARKING_SPEED }

[gcode_macro PURGE]
gcode:
  #M118 execute PURGE
  G90
  G1 X{ params.PURGE_LENGHT} F{ params.PURGE_SPEED } E{ params.PURGE_MATERIAL_QUANTITY }

# ------------------------- Macro utility estrusore --------------------------

[gcode_macro MIXING_STEPPER_ROTATION_DISTANCE]
description: Set Mixing stepper rotation distance
gcode:
  {% if not params.MIXING_STEPPER_ROTATION_VOLUME or params.MIXING_STEPPER_ROTATION_VOLUME|string|trim == "" %}
    M118 Error: Please set the default value for MIXING_STEPPER_ROTATION_VOLUME
    RESPOND TYPE=command MSG="action:prompt_begin Error"
    RESPOND TYPE=command MSG="action:prompt_text Open the dropdown to the right of the macro button and enter the value for MIXING_STEPPER_ROTATION_VOLUME."
    RESPOND TYPE=command MSG="action:prompt_footer_button continue|RESPOND TYPE=command MSG=action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% else %}
    SET_EXTRUDER_ROTATION_DISTANCE EXTRUDER=mixing_stepper DISTANCE={params.MIXING_STEPPER_ROTATION_VOLUME|float}
  {% endif %}


[gcode_macro EXTRUDER_ROTATION_DISTANCE]
description: Set Extruder rotation distance
gcode:
  {% if not params.EXTRUDER_ROTATION_VOLUME or params.EXTRUDER_ROTATION_VOLUME|string|trim == "" %}
    M118 Error: Please set the default value for EXTRUDER_ROTATION_VOLUME
    RESPOND TYPE=command MSG="action:prompt_begin Error"
    RESPOND TYPE=command MSG="action:prompt_text Open the dropdown to the right of the macro button and enter the value for EXTRUDER_ROTATION_VOLUME."
    RESPOND TYPE=command MSG="action:prompt_footer_button continue|RESPOND TYPE=command MSG=action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% else %}
    SET_EXTRUDER_ROTATION_DISTANCE EXTRUDER=extruder DISTANCE={params.EXTRUDER_ROTATION_VOLUME|float}
  {% endif %}


[gcode_macro SET_PRESSURE_ADVANCE_AND_SMOOTH_TIME]
description: Set pressure advance and smooth time
gcode:
  {% if not params.PRESSURE_ADVANCE or params.PRESSURE_ADVANCE|string|trim == "" %}
    M118 Error: Please set the default value for PRESSURE_ADVANCE
    RESPOND TYPE=command MSG="action:prompt_begin Error"
    RESPOND TYPE=command MSG="action:prompt_text Open the dropdown to the right of the macro button and enter the value for PRESSURE_ADVANCE."
    RESPOND TYPE=command MSG="action:prompt_footer_button continue|RESPOND TYPE=command MSG=action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% elif not params.PRESSURE_ADVANCE_SMOOTH_TIME or params.PRESSURE_ADVANCE_SMOOTH_TIME|string|trim == "" %}
    M118 Error: Please set the default value for PRESSURE_ADVANCE_SMOOTH_TIME
    RESPOND TYPE=command MSG="action:prompt_begin Error"
    RESPOND TYPE=command MSG="action:prompt_text Open the dropdown to the right of the macro button and enter the value for PRESSURE_ADVANCE_SMOOTH_TIME."
    RESPOND TYPE=command MSG="action:prompt_footer_button continue|RESPOND TYPE=command MSG=action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% else %}
    SET_PRESSURE_ADVANCE EXTRUDER=extruder ADVANCE={params.PRESSURE_ADVANCE|float}
    SET_PRESSURE_ADVANCE EXTRUDER=extruder SMOOTH_TIME={params.PRESSURE_ADVANCE_SMOOTH_TIME|float}
  {% endif %}

  # ------------------------- Frame tests --------------------------  [leo]
  
[gcode_macro TEST_X_STRESS]
description: Stress test asse X (500mm/s, 6000mm/s2)
gcode:
    SET_INPUT_SHAPER SHAPER_FREQ_X=0 DAMPING_RATIO_X=0 SHAPER_FREQ_Y=0 DAMPING_RATIO_Y=0   ;disabilito input shaper
    G28
    G90
    G21
    G1 Y500

    SET_VELOCITY_LIMIT VELOCITY=500 ACCEL=4000 ACCEL_TO_DECEL=4000      ; limiti

    {% set min_x = 20 %}          ; margine anticollisione endostops
    {% set max_x = 1020 %}

    G1 F30000                     ; 500 mm/s --> 30000 = 500*60

    {% for i in range(3000) %}
        G1 X{max_x}
        G1 X{min_x}
    {% endfor %}

    SET_INPUT_SHAPER SHAPER_TYPE_X=mzv SHAPER_FREQ_X=12.2 DAMPING_RATIO_X=0.076 \ SHAPER_TYPE_Y=3hump_ei SHAPER_FREQ_Y=19.8 DAMPING_RATIO_Y=0.07    ;abilito input shaper


  
[gcode_macro TEST_Y_STRESS]
description: Stress test asse X (500mm/s, 6000mm/s2)
gcode:
    SET_INPUT_SHAPER SHAPER_FREQ_X=0 DAMPING_RATIO_X=0 SHAPER_FREQ_Y=0 DAMPING_RATIO_Y=0   ;disabilito input shaper
    G28
    G90
    G21
    G1 X500

    SET_VELOCITY_LIMIT VELOCITY=500 ACCEL=4000 ACCEL_TO_DECEL=4000      ; limiti

    {% set min_y = 20 %}          ; margine anticollisione endostops
    {% set max_y = 1000 %}

    G1 F30000                     ; 500 mm/s --> 30000 = 500*60

    {% for i in range(3000) %}
        G1 Y{max_y}
        G1 Y{min_y}
    {% endfor %}

    SET_INPUT_SHAPER SHAPER_TYPE_X=mzv SHAPER_FREQ_X=12.2 DAMPING_RATIO_X=0.076 \ SHAPER_TYPE_Y=3hump_ei SHAPER_FREQ_Y=19.8 DAMPING_RATIO_Y=0.07    ;abilito input shaper


[gcode_macro TEST_XY_CIRCLE_STRESS]
description: Stress test cinematica XY - cerchio 1000 cicli
gcode:
    G28
    G90
    G21

    # Disabilito input shaper
    SET_INPUT_SHAPER SHAPER_FREQ_X=0 SHAPER_FREQ_Y=0

    # Limiti movimento
    SET_VELOCITY_LIMIT VELOCITY=500 ACCEL=4000 MINIMUM_CRUISE_RATIO=0

    # Centro cerchio: X500 Y500
    # Raggio: 300 mm
    # Quindi lavora da X200 a X800 e Y200 a Y800

    G1 F30000
    G1 X800 Y500

    {% for i in range(1000) %}
        G2 X800 Y500 I-400 J0 F30000
    {% endfor %}

    M400

    # Riabilito input shaper originale
    SET_INPUT_SHAPER SHAPER_TYPE_X=mzv SHAPER_FREQ_X=12.2 DAMPING_RATIO_X=0.076
    SET_INPUT_SHAPER SHAPER_TYPE_Y=3hump_ei SHAPER_FREQ_Y=19.8 DAMPING_RATIO_Y=0.07




[gcode_macro XY_SQUARE_TEST]
description: Stress test XY 800x800 - 1000 cicli
gcode:
    G28
    G90
    G21

    ; disabilita input shaper (consigliato per stress puro)
    SET_INPUT_SHAPER SHAPER_FREQ_X=0 SHAPER_FREQ_Y=0

    ; limiti dinamici
    SET_VELOCITY_LIMIT VELOCITY=500 ACCEL=4000 ACCEL_TO_DECEL=4000

    ; feedrate = 500 mm/s
    G1 F30000

    ; coordinate quadrato
    {% set x_min = 100 %}
    {% set y_min = 100 %}
    {% set x_max = 900 %}
    {% set y_max = 900 %}

    ; vai al punto iniziale
    G1 X{x_min} Y{y_min}

    {% for i in range(1000) %}
        G1 X{x_max} Y{y_min}
        G1 X{x_max} Y{y_max}
        G1 X{x_min} Y{y_max}
        G1 X{x_min} Y{y_min}
    {% endfor %}

    ; ripristina input shaper (i tuoi valori)
    SET_INPUT_SHAPER \
        SHAPER_TYPE_X=mzv SHAPER_FREQ_X=12.2 DAMPING_RATIO_X=0.076 \
        SHAPER_TYPE_Y=3hump_ei SHAPER_FREQ_Y=19.8 DAMPING_RATIO_Y=0.07
  