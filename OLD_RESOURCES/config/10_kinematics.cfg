# ============================================================================
# 10 - Kinematics: limiti macchina, input shaper e assi X/Y/Z
# ============================================================================

# -------------------------- Parametri macchina ------------------------------
[printer]
kinematics: cartesian
max_velocity: 500 #up to 300           
max_accel: 3000              
max_z_velocity: 10 #era 10              
max_z_accel: 100  #era 500 skippava allo start               
square_corner_velocity: 5.0     
minimum_cruise_ratio: 0.0

# ---------------------------- Geometrie GCode -------------------------------
[gcode_arcs]
resolution: 1.0

# ----------------------------- Input Shaper ---------------------------------
[input_shaper]

#shaper_type_x: mzv
shaper_freq_x: 0
#damping_ratio_x: 0.076
#shaper_type_y: 3hump_ei
shaper_freq_y: 0
#damping_ratio_y: 0.07 #0.078
#shaper_type: mzv


#shaper_type_x: mzv
#shaper_freq_x: 12.2
#damping_ratio_x: 0.076
#shaper_type_y: 3hump_ei
#shaper_freq_y: 19.8
#damping_ratio_y: 0.07 #0.078
#shaper_type: mzv

# ------------------------------- Asse X --------------------------------------
[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
microsteps: 8
rotation_distance: 78
full_steps_per_rotation: 200

#endstop_pin: tmc5160_stepper_x:virtual_endstop
endstop_pin: PG6
position_endstop: 0
position_max: 1100
homing_speed: 120
homing_retract_dist: 20
homing_retract_speed: 40
second_homing_speed: 10

[tmc5160 stepper_x]
cs_pin: PC4
spi_software_miso_pin: PA6
spi_software_mosi_pin: PA7
spi_software_sclk_pin: PA5
#diag1_pin: ^PG6
#driver_SGT: 10
run_current: 4 #3 max 4A
#hold_current: 1.8
sense_resistor: 0.022
interpolate: False
#stealthchop_threshold: 0


# ------------------------------- Asse Y --------------------------------------
[stepper_y]
step_pin: PG0
dir_pin: !PG1
enable_pin: !PF15
microsteps: 8
rotation_distance: 78
full_steps_per_rotation: 200

#endstop_pin: tmc5160_stepper_y:virtual_endstop
endstop_pin: PG9
position_endstop: 1000
position_max: 1000
homing_speed: 120
homing_retract_dist: 20
homing_retract_speed: 40
second_homing_speed: 10

[tmc5160 stepper_y]
cs_pin: PD11
spi_software_miso_pin: PA6
spi_software_mosi_pin: PA7
spi_software_sclk_pin: PA5
#diag1_pin: ^PG9
#driver_SGT: 10
run_current: 8 #6.4, era a 6 ma la catena fa perdere passi, max 8A
#hold_current: 5 #era 4.5
sense_resistor: 0.022
interpolate: False
#stealthchop_threshold: 0


# ------------------------------- Asse Z --------------------------------------
[stepper_z]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
microsteps: 8
rotation_distance: 4 #passo vite
full_steps_per_rotation: 200
step_pulse_duration: 0.00002
#endstop_pin: probe:z_virtual_endstop
endstop_pin: PG10
position_endstop: 0.0
# position_endstop: 12.850
position_min: -50

position_max: 1050
homing_speed: 7
homing_retract_dist: 2
homing_retract_speed: 8
second_homing_speed: 5

[tmc5160 stepper_z]
cs_pin: PC6
spi_software_miso_pin: PA6
spi_software_mosi_pin: PA7
spi_software_sclk_pin: PA5
run_current: 4
hold_current: 0.5
sense_resistor: 0.022
#stealthchop_threshold: 999999
interpolate: False
