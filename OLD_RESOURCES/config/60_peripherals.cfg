# ============================================================================
# 60 - Peripherals: buzzer, fan, LED e temperature sensors
# ============================================================================

# -------------------------------- Buzzer ------------------------------------

[output_pin _BUZZER_PIN]
pin: PG11
pwm: True
cycle_time: 0.0005     # 2 kHz
value: 0
shutdown_value: 0

[gcode_macro BUZZER_ON]
gcode:
    SET_PIN PIN=_BUZZER_PIN VALUE=0.5

[gcode_macro BUZZER_OFF]
gcode:
    SET_PIN PIN=_BUZZER_PIN VALUE=0

[gcode_macro BUZZER_TONE_FINAL]
gcode:
    BUZZER_ON
    G4 P400
    BUZZER_OFF
    G4 P500

    BUZZER_ON
    G4 P400
    BUZZER_OFF
    G4 P500

    BUZZER_ON
    G4 P1200
    BUZZER_OFF

[gcode_macro BUZZER_TONE_INITIAL]
gcode:
    BUZZER_ON
    G4 P200
    BUZZER_OFF
    G4 P200

    BUZZER_ON
    G4 P200
    BUZZER_OFF

[gcode_macro BUZZER_TONE_EMERGENCY]
gcode:
    BUZZER_ON
    G4 P2000
    BUZZER_OFF
    G4 P2000

[gcode_macro BUZZER_BEEP]
gcode:
    BUZZER_ON
    G4 P200
    BUZZER_OFF

# --------------------------------- Cooler -----------------------------------

[fan]
pin: PA8 #CNC_FAN0
cycle_time: 0.005
hardware_pwm: False
kick_start_time: 0.5
off_below: 0.1

[gcode_macro COOLER_FAN_SHUTDOWN]
gcode:
  #M118 execute COOLER_FAN_SHUTDOWN
  M107

# ----------------------------------- LED ------------------------------------

[led LED_CAMERA]
white_pin: PD15 #CNC_FAN5
cycle_time: 0.01

# -------------------------- Temperature sensors -----------------------------

[temperature_sensor Octopus]
sensor_type: temperature_mcu
sensor_mcu: mcu
#sensor_temperature1:
#sensor_adc1:

[temperature_sensor Pi]
sensor_type: temperature_host