# ============================================================================
# 30 - Bed: heater, verifica e macro servizio
# ============================================================================

# ----------------------------- Heater Bed -----------------------------------
[heater_bed]
heater_pin: PA1 # BED_OUT
sensor_pin: PF3
sensor_type: EPCOS 100K B57560G104F
control: watermark
max_delta: 1.0
min_temp: 0
max_temp: 110
pwm_cycle_time: 0.300
max_power: 1.00

# --------------------------- Heater Verify ----------------------------------
#[verify_heater heater_bed]
#max_error: 300 #120
#check_gain_time: 240 #20
#hysteresis: 10 #5
#heating_gain: 1 #2

[verify_heater heater_bed]
max_error: 100000
check_gain_time: 100000
hysteresis: 50
heating_gain: 0.1

# ----------------------------- Bed Macros -----------------------------------
[gcode_macro BED_HEATING]
gcode:
  #M118 execute BED_HEATING
  {% if params.BED_TEMPERATURE|float > 0.0 %}
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={params.BED_TEMPERATURE}
  {% endif %}

[gcode_macro BED_WAIT]
gcode:
  #M118 execute BED_WAIT
  {% if params.BED_TEMPERATURE_MIN|float > 0.0 %}
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={params.BED_TEMPERATURE_MIN} MAXIMUM={params.BED_TEMPERATURE_MAX}
  {% endif %}

[gcode_macro BED_SHUTDOWN]
gcode:
  #M118 execute BED_SHUTDOWN
  SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=0.0