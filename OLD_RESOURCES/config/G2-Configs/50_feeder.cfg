# ============================================================================
# 50 - Feeder: sensori materiale, stato e gestione runout
# ============================================================================

# --------------------------- IO e sensori base ------------------------------
[output_pin _FEEDER_STATUS]
pin: PG14 #USB-A

[filament_switch_sensor FEEDER]
switch_pin: PG15 #CNC_FAN4
pause_on_runout: False

# --------------------------- Delayed startup/status --------------------------
# Check periodico dello stato sensore e aggiornamento pin di stato
[delayed_gcode FEEDER_CHECK_STATUS]
initial_duration: 0.5
gcode:
  {% if printer["filament_switch_sensor FEEDER"].enabled %}
    SET_PIN PIN=_FEEDER_STATUS VALUE=1
  {% else %}
    SET_PIN PIN=_FEEDER_STATUS VALUE=0
  {% endif %}
  UPDATE_DELAYED_GCODE ID=FEEDER_CHECK_STATUS DURATION=1.0

# Disattiva il feeder all'avvio
[delayed_gcode FEEDER_STARTUP_STATUS]
initial_duration: 0.1
gcode: 
  FEEDER_DISABLE

# ---------------------------- Macro servizio --------------------------------
[gcode_macro FEEDER_ENABLE]
gcode:
  #M118 execute FEEDER_ENABLE
  SET_PIN PIN=_FEEDER_STATUS VALUE=1
  SET_FILAMENT_SENSOR SENSOR=FEEDER ENABLE=1

[gcode_macro FEEDER_DISABLE]
gcode:
  #M118 execute FEEDER_DISABLE
  SET_PIN PIN=_FEEDER_STATUS VALUE=0
  SET_FILAMENT_SENSOR SENSOR=FEEDER ENABLE=0

[gcode_macro FEEDER_RUNOUT_VARS]
variable_has_pellet: True
gcode:
  # Silent is golden

# ------------------------- Runout e gestione pausa --------------------------
[gcode_button FEEDER_RUNOUT]
pin: ^!PD0
press_gcode:
    M118 WARNING: Material is running out! 
    RESPOND TYPE=command MSG="action:prompt_begin WARNING: Material is running out!"
    RESPOND TYPE=command MSG="action:prompt_text Please refill the feeder to continue printing."
    RESPOND TYPE=command MSG="action:prompt_footer_button continue|RESPOND TYPE=command MSG=action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_show"
    SET_GCODE_VARIABLE MACRO=FEEDER_RUNOUT_VARS VARIABLE=has_pellet VALUE=False
    UPDATE_DELAYED_GCODE ID=GINGER_FEEDER_RUNOUT_PAUSE DURATION=600
release_gcode:
    SET_GCODE_VARIABLE MACRO=FEEDER_RUNOUT_VARS VARIABLE=has_pellet VALUE=True

[delayed_gcode GINGER_FEEDER_RUNOUT_PAUSE]
gcode:
  {% set feeder_on = printer["output_pin _FEEDER_STATUS"].value %}
  
  {% if not printer["gcode_macro FEEDER_RUNOUT_VARS"].has_pellet and feeder_on == 1 %}
      PAUSE
      FEEDER_DISABLE
      M118 INFO: printing has been paused due to lack of pellets AND feeder active
  {% else %}
      M118 DEBUG: Pause skipped
  {% endif %}