# ============================================================================
# 80 - System: configurazione base Klipper e macro START/END print
# ============================================================================
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_280026001051313234353230-if00
        
[force_move]
enable_force_move: True

[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[exclude_object]

[idle_timeout]
timeout: 900

[pause_resume]
recover_velocity: 80

[display_status]

[respond]

[danger_options]
override_pressure_advance_smooth_time_max=999

# ============================================================================
# Macro di avvio/fine stampa
# ============================================================================
[gcode_macro START_PRINT]
gcode:
  LED_MESSAGE msg="Starting"
  #M118 execute START_PRINT
  
  SET_PRESSURE_ADVANCE EXTRUDER=extruder SMOOTH_TIME=0.04
  SET_PRESSURE_ADVANCE EXTRUDER=extruder ADVANCE=0.0
  
  BUZZER_TONE_INITIAL
  FEEDER_ENABLE

  # Spegno le ventole dell'estrusore
  M107

  BED_HEATING BED_TEMPERATURE={ params.BED_TEMPERATURE|default(40.0)|float }
  
  EXTRUDER_SET_ZONE_1 S={ params.ZONE_1_TEMPERATURE|default(200.0)|float }
  EXTRUDER_SET_ZONE_2 S={ params.ZONE_2_TEMPERATURE|default(200.0)|float }
  EXTRUDER_SET_ZONE_3 S={ params.ZONE_3_TEMPERATURE|default(200.0)|float }
  EXTRUDER_SET_ZONE_4 S={ params.ZONE_4_TEMPERATURE|default(200.0)|float }
  
  PROBE_LEVELING KAMP_LEVELING={ params.KAMP_LEVELING|default(0) }
  PURGE_PARKING PURGE_LAYER_HEIGHT={ params.PURGE_LAYER_HEIGHT|default(2) } PURGE_PARKING_SPEED={ params.PURGE_PARKING_SPEED|default(12000) }
  
  EXTRUDER_WAIT_ZONE_1 S={ params.ZONE_1_TEMPERATURE|default(200.0)|float }
  EXTRUDER_WAIT_ZONE_2 S={ params.ZONE_2_TEMPERATURE|default(200.0)|float }
  EXTRUDER_WAIT_ZONE_3 S={ params.ZONE_3_TEMPERATURE|default(200.0)|float }
  EXTRUDER_WAIT_ZONE_4 S={ params.ZONE_4_TEMPERATURE|default(200.0)|float }

  BED_WAIT BED_TEMPERATURE_MIN={ params.BED_TEMPERATURE_MIN|default(params.BED_TEMPERATURE|default(40.0)|float - 10)|float } BED_TEMPERATURE_MAX={ params.BED_TEMPERATURE_MAX|default(params.BED_TEMPERATURE|default(40.0)|float + 20)|float }

  EXTRUDER_MIXING_MULTIPLIER S=1 #aggiunto da davide da modificare per associare a orca
  SET_EXTRUDER_ROTATION_DISTANCE EXTRUDER=extruder DISTANCE={ params.EXTRUDER_ROTATION_VOLUME|default(465) }
  SET_EXTRUDER_ROTATION_DISTANCE EXTRUDER=mixing_stepper DISTANCE={ params.MIXING_STEPPER_ROTATION_VOLUME|default(6000) }


  PURGE PURGE_LENGHT={ params.PURGE_LENGHT|default(300) } PURGE_SPEED={ params.PURGE_SPEED|default(500) } PURGE_MATERIAL_QUANTITY={ params.PURGE_MATERIAL_QUANTITY|default(1000) }
  
  #TODO: verificare utilità dei comandi sottostanti, nel caso rimuoverli,  da grasshopper bisogna metterli, da orca li mette orca
  G90
  G92 E0
  M83
  
  BUZZER_TONE_INITIAL

  SET_PRESSURE_ADVANCE EXTRUDER=extruder ADVANCE={ params.PRESSURE_ADVANCE|default(0)|float } #ugello 3mm 0.8 ugello 1.2mm low flow 1.1 \ flow 500mm3s 0.1
  SET_PRESSURE_ADVANCE EXTRUDER=extruder SMOOTH_TIME={ params.PRESSURE_ADVANCE_SMOOTH_TIME|default(0.04)|float } #ugello 3mm 0.35 ugello 1.2mm low flow 0.67 \ flow 500mm3s 0.2
  LED_MESSAGE msg="Printing"
  
[gcode_macro END_PRINT]
gcode:
  #M118 execute END_PRINT
  
  SET_PRESSURE_ADVANCE EXTRUDER=extruder SMOOTH_TIME=0.04
  SET_PRESSURE_ADVANCE EXTRUDER=extruder ADVANCE=0.0

  BED_SHUTDOWN
  EXTRUDER_SHUTDOWN
  COOLER_FAN_SHUTDOWN
  FEEDER_DISABLE

  #TODO: verificare utilità dei comandi sottostanti, nel caso rimuoverli
  #G91
  #G1 F100 Z30
  #G90
  
  G28 X
  M84
  BUZZER_TONE_FINAL
  LED_MESSAGE msg="Finish"

[delayed_gcode STARTUP_GCODE]
initial_duration: 0.1
gcode:
    LED_MESSAGE msg="G2"