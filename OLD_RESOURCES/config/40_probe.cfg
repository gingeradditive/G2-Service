# ============================================================================
# 40 - Probe: servo, homing Z, mesh e macro di livellamento
# ============================================================================

# --------------------------- Hardware probe ---------------------------------
[servo PROBE_SERVO]
pin: PG12
maximum_servo_angle: 190
minimum_pulse_width: 0.00077 #valore che corrisponde allo zero
maximum_pulse_width: 0.00216 #valore che corrisponde al maximum_servo_angle
initial_angle: 0 #lo setto che sta in alto, NOTA 09/06/26, se si imposta a 185 va in errore (fusibile buzzer di emergenza octopus), diminuendo l'angolo a 180 pare risolvere il problema (forse rush current)

[probe]
pin: PG13
deactivate_on_each_sample: false #importante
x_offset: 0
y_offset: 90
z_offset: 10.0
speed: 10
samples: 1
sample_retract_dist: 3.0
samples_result: average
samples_tolerance: 0.200
samples_tolerance_retries: 1
activate_gcode: 
  PROBE_DOWN
deactivate_gcode: 
  PROBE_UP

# ----------------------------- Homing e mesh --------------------------------
[safe_z_home]
home_xy_position: 0, 1000
speed: 100
z_hop: 15
z_hop_speed: 8.0

[bed_mesh]
speed: 270
horizontal_move_z: 20 #15; Da scegliere a seconda dello z offset, deve essere di più
mesh_min: 0, 90
mesh_max: 1000, 1000 #1000
probe_count: 12, 12
fade_start: 5
fade_end: 50
algorithm: bicubic
bicubic_tension: 0.2

#[screws_tilt_adjust]
#screw1: 0, 0
#screw1_name: front left screw
#screw2: 1000, 0
#screw2_name: front right screw
#screw3: 0, 1000
#screw3_name: rear right screw
#screw4: 1000, 1000
#screw4_name: rear left screw
#horizontal_move_z: 35
#speed: 150
#screw_factor: 2.365
#screw_direction: CCW


# -------------------------- Macro livellamento ------------------------------
[gcode_macro BED_LEVEL]
description: used to ensure the 3D printer's bed is leveled properly, providing a consistent surface for printing. It automates the process of adjusting the bed's height at specific points to achieve an even level across the printing area. Proper bed leveling improves adhesion and print quality, preventing issues like warping or uneven layers. After running the macro, you can view the results in the Heightmap section of the printer's menu, which displays a visual representation of the bed's leveling status.
gcode:
  #M118 execute BED_LEVEL
	G28
	_BED_MESH_CALIBRATE PROFILE=global METHOD=automatic speed=270 horizontal_move_z=20 mesh_min=0,90 mesh_max=1000,950 probe_count=12,12 fade_start=5 fade_end=50 algorithm=bicubic bicubic_tension=0.2
  BED_MESH_PROFILE SAVE=global

[gcode_macro LOAD_MESH]
gcode:
  #M118 execute LOAD_MESH
  G28
  BED_MESH_PROFILE LOAD=global

# ------------------------- Macro gestione servo -----------------------------
[gcode_macro PROBE_UP]
gcode:
  # M118 execute PROBE_UP
  UPDATE_DELAYED_GCODE ID=PROBE_UP_REQUEST DURATION=0.1
  G4 P100

[delayed_gcode PROBE_UP_REQUEST]
gcode:
  # M118 execute PROBE_UP_REQUEST
  PROBE_UP_EXECUTION

[gcode_macro PROBE_UP_EXECUTION]
gcode:
  # M118 execute PROBE_UP_EXECUTION 
  G91
  G1 Z1
  SET_SERVO SERVO=PROBE_SERVO ANGLE=0
  G4 P1500
  G1 Z-1
  G90  

[gcode_macro PROBE_DOWN]
gcode:
  #M118 execute PROBE_DOWN
  SET_SERVO SERVO=PROBE_SERVO ANGLE=180
  G4 P1500

# --------------------------- Macro orchestrazione ---------------------------
[gcode_macro PROBE_LEVELING]
gcode:
  {% if params.KAMP_LEVELING|int == 1 %}
    #M118 execute PROBE_LEVELING mode:Kamp
    G28
	  BED_MESH_CALIBRATE PROFILE=mesh1 METHOD=automatic
  {% else %}
    #M118 execute PROBE_LEVELING mode:Global
    G28
    LOAD_MESH
  {% endif %}
  PROBE_UP_EXECUTION

[gcode_macro SCREW_ADJUSTMENT]
description: assists in manually leveling the 3D printer's bed by adjusting the screws at specific points. It guides you through the process of fine-tuning the bed's height to ensure an even surface for optimal printing. Proper screw adjustment improves layer adhesion and overall print quality. Once the process is complete, you can check the results in the Heightmap section of the printer's menu, which provides a visual representation of the bed's leveling status.
gcode:
  G28
  SCREWS_TILT_CALCULATE