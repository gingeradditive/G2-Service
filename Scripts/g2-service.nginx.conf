# Depositato da Scripts/install.sh in /etc/nginx/g2-locations.d/g2-service.conf.
#
# Il site di GingerView include questa directory dentro il proprio blocco `server`, così
# ogni servizio installa la propria `location` invece di averla cablata in un altro
# repository (docs 05 — Nginx).
#
# `^~` ha la precedenza sulle `location` regex, quindi vince sulla regex di Moonraker
# (`~ ^/(printer|api|access|machine|server)/`) anche se questa venisse valutata prima.
# Attenzione a non confondere `/service/` (nostro) con `/server/` (Moonraker).

location ^~ /service/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Scheme $scheme;

    # Può restare basso: non ci sono richieste lunghe. Le operazioni che durano sono job
    # asincroni che rispondono subito (docs 02 — Operazioni lunghe).
    proxy_read_timeout 120;
}
